<!-- src/app/footer.html: Application footer -->
<div class="footer-separator"></div>
<footer class="footer">
  <div>
    <p class="icons">
      <span class="accent-color-control">
        <button
          class="theme-toggle"
          type="button"
          (click)="onToggleAccentColor()"
          title="Choose custom accent color"
          aria-label="Choose custom accent color"
          aria-controls="accentColorInput"
        >
          <fa-icon [icon]="faPaintBrush"></fa-icon>
        </button>
        <input
          (input)="onChangeAccentColor($event)"
          type="color"
          id="accentColorInput"
          name="accentColorInput"
          [value]="accentColor"
          aria-label="Accent color"
        />
      </span>
      <button
        class="theme-toggle"
        type="button"
        (click)="onToggleDarkTheme()"
        title="Switch between light/dark theme"
        aria-label="Switch between light and dark theme"
      >
        <fa-icon [icon]="faMoon"></fa-icon>
      </button>
      <a
        target="_blank"
        rel="noopener noreferrer"
        href="https://github.com/radualexandrub/Mood-Tracker-Daily-Calendar"
        aria-label="Check out the source code on GitHub"
      >
        <fa-icon [icon]="faGithub" title="Check out the source code on GitHub"></fa-icon>
      </a>
    </p>
    <p>Made with <a target="_blank" rel="noopener noreferrer" href="https://angular.dev">Angular</a> 
      & <a target="_blank" rel="noopener noreferrer" href="https://nodejs.org">Node.js</a></p>
    <p>Copyright 2026 &copy; <a target="_blank" rel="noopener noreferrer" href="https://radubulai.com">Radu-Alexandru B.</a></p>
  </div>
</footer>
